<html>
    <head>
        <title>PoE Ladder Desktop App: Configuration</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="menu">
            <button id="close" title="Close application"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M400 54.1c63 45 104 118.6 104 201.9 0 136.8-110.8 247.7-247.5 248C120 504.3 8.2 393 8 256.4 7.9 173.1 48.9 99.3 111.8 54.2c11.7-8.3 28-4.8 35 7.7L162.6 90c5.9 10.5 3.1 23.8-6.6 31-41.5 30.8-68 79.6-68 134.9-.1 92.3 74.5 168.1 168 168.1 91.6 0 168.6-74.2 168-169.1-.3-51.8-24.7-101.8-68.1-134-9.7-7.2-12.4-20.5-6.5-30.9l15.8-28.1c7-12.4 23.2-16.1 34.8-7.8zM296 264V24c0-13.3-10.7-24-24-24h-32c-13.3 0-24 10.7-24 24v240c0 13.3 10.7 24 24 24h32c13.3 0 24-10.7 24-24z"></path></svg></button>
        </div>
        <form>
            <input type="text" id="username" value=""/>
            <input type="text" id="ladderIdentifier" value="" />
            <select id="skin">
                <option value="ziz">Zizaran</option>
                <option value="">Original</option>
            </select>
        </form>
        <button id="save">Save</button>

        <script type="text/javascript">

            const params = new URL(location.href).searchParams;

            document.getElementById('username').value = params.get('username');
            document.getElementById('ladderIdentifier').value = params.get('ladderIdentifier');
            
            var select = document.getElementById("skin");
            const skin = params.get('skin');
            for(var i = 0;i < select.options.length;i++){
                if(select.options[i].value == skin ){
                    select.options[i].selected = true;
                }
            }

            document.getElementById('close').addEventListener('click', () => {
                window.electronAPI.closeApp();
            });

            document.getElementById('save').addEventListener('click', () => {
                window.electronAPI.saveConfig({
                    "username": document.getElementById('username').value,
                    "ladderIdentifier": document.getElementById('ladderIdentifier').value,
                    "skin": document.getElementById('skin').value
                });
            });

        </script>
    </body>
</html>
